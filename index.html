<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Photocatalyst HER Predictor Dashboard</title>
    <!-- Stlite styling -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.59.0/build/style.css"
    />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0e1117;
        font-family: 'Inter', sans-serif;
        color: #ffffff;
        overflow: hidden;
      }
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      .loader-container {
        text-align: center;
        max-width: 480px;
        width: 85%;
        padding: 40px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(16px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      }
      h1 {
        font-family: 'Outfit', sans-serif;
        font-weight: 800;
        font-size: 2.2rem;
        margin: 0 0 10px 0;
        background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p {
        font-size: 1.1rem;
        color: #94a3b8;
        margin: 0 0 30px 0;
      }
      .spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(56, 189, 248, 0.1);
        border-top: 4px solid #38bdf8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 30px auto;
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .status-text {
        font-family: monospace;
        font-size: 0.9rem;
        color: #818cf8;
        margin-top: 10px;
        height: 20px;
      }
      .progress-bar-bg {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        overflow: hidden;
      }
      .progress-bar-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        transition: width 0.4s ease;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader-container">
        <div class="spinner"></div>
        <h1>Photocatalyst HER Predictor</h1>
        <p>Launching dashboard in WebAssembly (Stlite)...</p>
        <div class="progress-bar-bg">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
        <div id="status" class="status-text">Initializing Python environment...</div>
      </div>
    </div>
    
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.59.0/build/stlite.js"></script>
    <script>
      // Simulate progress bar while loading WebAssembly
      let progress = 5;
      const progressFill = document.getElementById('progress-fill');
      const statusText = document.getElementById('status');
      
      const progressInterval = setInterval(() => {
        if (progress < 85) {
          progress += Math.random() * 4;
          progressFill.style.width = `${Math.min(progress, 85)}%`;
          if (progress > 60) {
            statusText.innerText = "Loading candidate datasets (19.7 MB)...";
          } else if (progress > 30) {
            statusText.innerText = "Installing libraries (pandas, numpy, plotly)...";
          } else {
            statusText.innerText = "Loading WebAssembly runtime (Pyodide)...";
          }
        }
      }, 800);

      stlite.mount({
        requirements: ["pandas", "numpy", "plotly"],
        entrypoint: "dashboard.py",
        files: {
          "dashboard.py": { url: "dashboard.py" },
          "data/processed/df_clean.csv": { url: "data/processed/df_clean.csv" },
          "data/results/discovery_candidates.csv": { url: "data/results/discovery_candidates.csv" },
          "data/results/training_results.json": { url: "data/results/training_results.json" },
          "data/results/conformal_summary.json": { url: "data/results/conformal_summary.json" },
          "data/results/conformal_intervals.csv": { url: "data/results/conformal_intervals.csv" },
          "data/results/ad_summary.json": { url: "data/results/ad_summary.json" },
          // Publication and shap figures
          "data/results/figures/fig1_dataset_overview.png": { url: "data/results/figures/fig1_dataset_overview.png" },
          "data/results/figures/fig2_model_comparison.png": { url: "data/results/figures/fig2_model_comparison.png" },
          "data/results/figures/fig3_actual_vs_predicted.png": { url: "data/results/figures/fig3_actual_vs_predicted.png" },
          "data/results/figures/fig4_shap_analysis.png": { url: "data/results/figures/fig4_shap_analysis.png" },
          "data/results/figures/fig5_per_material_performance.png": { url: "data/results/figures/fig5_per_material_performance.png" },
          "data/results/figures/fig6_discovery_candidates.png": { url: "data/results/figures/fig6_discovery_candidates.png" },
          "data/results/figures/fig7_calibration_curve.png": { url: "data/results/figures/fig7_calibration_curve.png" },
          "data/results/figures/fig8_ablation.png": { url: "data/results/figures/fig8_ablation.png" },
          "data/results/figures/fig9_applicability_domain.png": { url: "data/results/figures/fig9_applicability_domain.png" },
          "data/results/figures/fig_applicability_domain.png": { url: "data/results/figures/fig_applicability_domain.png" }
        }
      }, document.getElementById("root")).then(() => {
        clearInterval(progressInterval);
        progressFill.style.width = '100%';
        statusText.innerText = "Dashboard Ready!";
        setTimeout(() => {
          const screen = document.getElementById('loading-screen');
          screen.style.opacity = '0';
          setTimeout(() => screen.remove(), 500);
        }, 300);
      });
    </script>
  </body>
</html>
