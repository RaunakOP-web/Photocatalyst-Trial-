  - name: vb_potential_nhe
    source: Materials Project API (fallback)
    uncertainty: false
  - name: cb_overpotential_h2
    source: derived from cb_potential_nhe
    uncertainty: false
  - name: vb_overpotential_glycerol
    source: derived from vb_potential_nhe
    uncertainty: false
hydrogen_adsorption:
