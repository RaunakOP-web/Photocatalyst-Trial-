    source: Nørskov et al. 2005 dataset
    uncertainty: false
  - name: cocat_h_binding_strength
    source: derived from cocat_dg_h_proxy
    uncertainty: false
carrier_mobility:
  - name: electron_effective_mass
    source: literature lookup table (placeholder)
    uncertainty: false
  - name: hole_effective_mass
    source: literature lookup table (placeholder)
    uncertainty: false
  - name: carrier_mobility_score
    source: derived from effective masses
    uncertainty: false
exciton_binding:
  - name: exciton_binding_proxy
