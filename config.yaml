paths:
  raw_dir:     "data/raw"
  proc_dir:    "data/processed"
  models_dir:  "models"
  results_dir: "data/results"

data:
  target:            "HER_std_umol_g_h"
  hash_col:          "experiment_hash"
  group_col:         "host_material"       # grouping key for LOGO-CV / GroupShuffleSplit
  random_state:      42
  test_size:         0.15
  missing_threshold: 0.90                   # stricter: drop cols with ≥90% missing

  leakage_cols:
    - "AQY_pct"
    - "AQE_pct"
    - "STH_pct"
    - "HER_reported"
    - "semi_bandgap_eV"
    - "semi_electron_affinity_eV"
    - "semi_dielectric"
    - "semi_crystal"
    - "semi_density"
    - "cocat_work_function"
    - "cocat_d_band_center"
    - "cocat_atomic_radius"
    - "cocat_electronegativity"
    - "cocat_price"

  provenance_cols:
    - "DOI"
    - "source_url"
    - "paper_title"
    - "journal"
    - "year"
    - "authors"
    - "reference_match_check"
    - "data_quality_flag"
    - "data_quality_note"
    - "experiment_hash"
    - "full_catalyst"
    - "HER_reported"
    - "log_HER"
    - "metadata_completeness_score"
    - "catalyst_loading_reported"
    - "glycerol_concentration_reported"
    - "light_power_reported"
    - "irradiance_reported"

  cat_cols:
    - "host_material"
    - "co_catalyst"
    - "semiconductor_2"
    - "semiconductor_3"
    - "form"
    - "structure"
    - "preparation_semiconductor"
    - "preparation_photocatalyst"
    - "sacrificial_donor"
    - "reactor_type"
    - "water_source"
    - "light_source_type"
    - "light_type"

  confidence_weight_map:
    HIGH:   1.0
    MEDIUM: 0.7
    LOW:    0.3

  confidence_weight_cols:
    - "confidence_HER"
    - "confidence_loading"
    - "confidence_light"
    - "confidence_wavelength"

tuning:
  n_trials:              100
  cv_folds:              5
  timeout_seconds:       900
  logo_cv_splits:        null         # null = use LeaveOneGroupOut for final eval
  repeated_seeds:        [42]         # single seed for speed; add more for final publication run

models:
  # Model pool for benchmarking (all evaluated)
  pool:
    - "XGBoost"
    - "LightGBM"
    - "CatBoost"
    - "HistGBM"
    - "ExtraTrees"
    - "RandomForest"
    - "Ridge"
    - "Stacking"          # stacked ensemble of top-3

  xgboost:
    tree_method: "hist"
    verbosity:   0
  lightgbm:
    verbose: -1
  catboost:
    verbose: 0
  histgbm: {}
